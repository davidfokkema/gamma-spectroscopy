[project]
name = "gamma-spectroscopy"
version = "1.2.0"
description = "A GUI for gamma spectroscopy using a PicoScope"
readme = "README.md"
authors = [
    { name = "David Fokkema", email = "davidfokkema@icloud.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "picosdk",
    "pyqt5>=5.15.11",
    "pyqtgraph>=0.14.0",
]

[project.scripts]
gamma-spectroscopy = "gamma_spectroscopy.gamma_spectroscopy_gui:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
picosdk = { git = "https://github.com/picotech/picosdk-python-wrappers" }
