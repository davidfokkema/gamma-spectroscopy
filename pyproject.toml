[project]
name = "gamma-spectroscopy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Fokkema", email = "davidfokkema@icloud.com" },
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "picosdk",
    "pyqt5>=5.15.11",
    "pyqtgraph>=0.14.0",
]

[project.scripts]
gamma-spectroscopy = "gamma_spectroscopy.gamma_spectroscopy_gui:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
picosdk = { git = "https://github.com/picotech/picosdk-python-wrappers" }
